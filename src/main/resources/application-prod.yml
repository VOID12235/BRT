spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:btr}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:btr}
    password: ${DB_PASSWORD:btr_pass}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

app:
  captcha:
    enabled: true
  seed-demo: ${SEED_DEMO:false}
  bootstrap-admin:
    account: ${ADMIN_ACCOUNT:admin}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:平台管理员}
    email: ${ADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ORIGINS:https://btr.example.com}
