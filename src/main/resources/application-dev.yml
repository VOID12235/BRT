spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/btr?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: btr
    password: btr_pass
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

app:
  seed-demo: true
