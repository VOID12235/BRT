spring:
  application:
    name: btr-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/html,text/css,text/plain,text/xml,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:btr-platform-dev-secret-key-please-change-in-production-2026}
    access-hours: 2
    refresh-days: 7
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    public-base: /api/v1/files
  seed-demo: ${SEED_DEMO:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  security:
    # 默认不信任代理头；部署在 Nginx 之后时设为 true（docker-compose 已默认开启）
    trust-proxy: ${TRUST_PROXY:false}

logging:
  level:
    com.btr.platform: info
    org.springframework.security: warn
