spring:
  application:
    name: btr-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:btr-platform-dev-secret-key-please-change-in-production-2026}
    access-hours: 2
    refresh-days: 7
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    public-base: /api/v1/files
  seed-demo: ${SEED_DEMO:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    com.btr.platform: info
    org.springframework.security: warn
