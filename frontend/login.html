<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册 · BTR 赛事平台</title>
  <meta name="description" content="BTR 赛事平台登录与注册：选手、评委、管理员账号登录入口。" />
  <meta name="keywords" content="登录,注册,赛事账号,BTR赛事平台" />
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/pages.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261105c" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <aside class="auth-visual">
        <a class="brand" href="/index.html">
          <span class="brand-mark">B</span>
          <span class="brand-name">BTR<em>赛事平台</em></span>
        </a>
        <div class="auth-quote">
          <h2>认真对待<br />每一份作品。</h2>
          <p>报名、提交、评审、公示，一条清晰的链路，让组织者省心，让创作者专注。</p>
        </div>
      </aside>

      <div class="auth-form-wrap">
        <div class="auth-tabs" id="authTabs">
          <button type="button" class="is-active" data-auth-tab="login">登录</button>
          <button type="button" data-auth-tab="register">注册选手账号</button>
        </div>

        <div id="loginPanel">
          <h1>欢迎回来</h1>
          <p class="sub">登录后即可报名赛事、提交作品或进入评委 / 管理后台。</p>
          <form class="auth-form" id="loginForm" novalidate>
            <div class="field">
              <label for="loginAccount">账号 / 邮箱</label>
              <input class="input" id="loginAccount" name="account" autocomplete="username" placeholder="请输入账号或注册邮箱" required />
            </div>
            <div class="field">
              <label for="loginPassword">密码</label>
              <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
            </div>
            <div class="field hidden" id="captchaField">
              <label for="captchaCode">验证码</label>
              <div class="captcha-row">
                <input class="input" id="captchaCode" placeholder="请输入验证码" autocomplete="off" />
                <img class="captcha-img" id="captchaImg" alt="验证码" />
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px">
              <span class="tiny muted">还没有账号？切换到「注册选手账号」</span>
              <a class="tiny" href="/forgot-password.html" style="text-decoration:underline">忘记密码？</a>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginSubmit">登录</button>
          </form>
        </div>

        <div id="registerPanel" class="hidden">
          <h1>创建账号</h1>
          <p class="sub">注册后默认为选手角色。账号即注册邮箱，登录时输入邮箱与密码即可。</p>
          <form class="auth-form" id="registerForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="regNickname">昵称</label>
                <input class="input" id="regNickname" name="nickname" placeholder="展示名称" required />
              </div>
              <div class="field span-2">
                <label for="regEmail">邮箱（即登录账号）</label>
                <div class="captcha-row">
                  <input class="input" id="regEmail" name="email" type="email" placeholder="用于接收验证码与通知" autocomplete="email" required />
                  <button class="btn btn-outline" type="button" id="sendRegCodeBtn" style="white-space:nowrap">获取验证码</button>
                </div>
              </div>
              <div class="field span-2">
                <label for="regCode">邮箱验证码</label>
                <input class="input" id="regCode" name="code" placeholder="请输入 6 位验证码" autocomplete="one-time-code" required />
              </div>
              <div class="field">
                <label for="regPassword">密码</label>
                <input class="input" id="regPassword" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required />
              </div>
              <div class="field">
                <label for="regConfirm">确认密码</label>
                <input class="input" id="regConfirm" type="password" placeholder="再次输入密码" required />
              </div>
            </div>
            <div class="tiny muted" style="margin:10px 0 14px">无需设置账号：你的登录账号就是注册邮箱。</div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="registerSubmit">注册并登录</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js?v=20261105a3"></script>
  <script src="/assets/js/auth.js?v=20261105c"></script>
</body>
</html>
