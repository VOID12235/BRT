  <meta name="description" content="浏览 BTR 赛事平台全部赛事：报名中、进行中、已公示与已结束赛事，支持线上作品赛与线下评分赛。" />
  <meta name="keywords" content="赛事列表,赛事中心,比赛报名,在线赛事,BTR赛事平台" />
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105c" />

<body>
  <div data-header></div>

  <main class="page-main">
    <div class="container">
      <div class="page-head">
        <div class="breadcrumb"><a href="/index.html">首页</a><span>/</span><span>赛事</span></div>

      <div class="toolbar" style="margin-bottom: 24px">
        <div class="tabs" id="statusTabs">
          <button type="button" data-status="" class="is-active">全部</button>

          <button type="button" data-status="REVIEW">进行中</button>
          <button type="button" data-status="PUBLISHED">已公示</button>
          <button type="button" data-status="FINISHED">已结束</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="keyword" type="search" placeholder="搜索赛事名称或关键词" />
        </div>
        <div class="muted small" id="resultCount" style="margin-left: auto"></div>
      </div>

      <div class="contest-grid" id="contestGrid">
        <div class="card skeleton" style="height: 356px"></div>
        <div class="card skeleton" style="height: 356px"></div>
        <div class="card skeleton" style="height: 356px"></div>
        <div class="card skeleton" style="height: 356px"></div>

        <div class="card skeleton" style="height: 356px"></div>

    </div>
