<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 · BTR 赛事平台</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card" style="max-width: 560px">
      <div class="auth-form-wrap" style="flex: 1; padding: 48px 40px">
        <a class="brand" href="/index.html" style="margin-bottom: 28px">
          <span class="brand-mark">B</span>
          <span class="brand-name">BTR<em>赛事平台</em></span>
        </a>
        <h1>找回密码</h1>
        <p class="sub">通过注册邮箱获取验证码后重置密码。</p>

        <form class="auth-form" id="forgotForm" novalidate>
          <div class="field">
            <label for="fpEmail">注册邮箱</label>
            <input class="input" id="fpEmail" name="email" type="email" placeholder="请输入注册邮箱" required />
          </div>
          <div class="field">
            <label for="fpCode">邮箱验证码</label>
            <div style="display:flex;gap:10px">
              <input class="input" id="fpCode" name="code" placeholder="6 位验证码" autocomplete="off" maxlength="6" required />
              <button type="button" class="btn btn-outline" id="fpSendBtn" style="white-space:nowrap">获取验证码</button>
            </div>
          </div>
          <div class="field">
            <label for="fpPassword">新密码</label>
            <input class="input" id="fpPassword" name="newPassword" type="password" placeholder="6-32 位" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="fpConfirm">确认新密码</label>
            <input class="input" id="fpConfirm" type="password" placeholder="再次输入新密码" required />
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="fpSubmit">重置密码</button>
          <p class="tiny muted center" style="margin-top:16px">
            <a href="/login.html">← 返回登录</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    (function () {
      var B = window.BTR;
      var sendBtn = document.getElementById("fpSendBtn");
      var countdown = 0;

      sendBtn.addEventListener("click", async function () {
        var email = document.getElementById("fpEmail").value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          B.toast("请输入正确的邮箱地址", "warn");
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "发送中…";
        try {
          var data = await B.api.post("/auth/forgot-password", { email: email });
          B.toast((data && data.message) || "验证码已发送，请查收邮件", "success");
          countdown = 60;
          sendBtn.disabled = true;
          sendBtn.textContent = countdown + "s 后重发";
          var timer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
              clearInterval(timer);
              sendBtn.disabled = false;
              sendBtn.textContent = "获取验证码";
            } else {
              sendBtn.textContent = countdown + "s 后重发";
            }
          }, 1000);
        } catch (e) {
          B.toast(e.message || "发送失败", "error");
          sendBtn.disabled = false;
          sendBtn.textContent = "获取验证码";
        }
      });

      document.getElementById("forgotForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = document.getElementById("fpEmail").value.trim();
        var code = document.getElementById("fpCode").value.trim();
        var pwd = document.getElementById("fpPassword").value;
        var confirm = document.getElementById("fpConfirm").value;
        if (pwd.length < 6 || pwd.length > 32) {
          B.toast("密码长度需为 6-32 位", "warn");
          return;
        }
        if (pwd !== confirm) {
          B.toast("两次输入的密码不一致", "warn");
          return;
        }
        var submit = document.getElementById("fpSubmit");
        submit.disabled = true;
        submit.textContent = "提交中…";
        try {
          await B.api.post("/auth/reset-password", { email: email, code: code, newPassword: pwd });
          B.toast("密码已重置，请使用新密码登录", "success");
          setTimeout(function () {
            location.href = "/login.html";
          }, 1200);
        } catch (err) {
          B.toast(err.message || "重置失败", "error");
          submit.disabled = false;
          submit.textContent = "重置密码";
        }
      });
    })();
  </script>
</body>
</html>
