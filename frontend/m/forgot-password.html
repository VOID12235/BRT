<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<title>找回密码 · BTR赛事平台</title>
<meta name="description" content="BTR 赛事平台手机版找回密码。" />
<link rel="stylesheet" href="/m/m.css?v=20261105m2">
<style>
  .auth-form { margin-top: 6px; }
  .field { display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px; height: 52px;
    margin-bottom: 12px; transition: border-color .15s ease, box-shadow .15s ease; }
  .field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(229,72,77,.12); }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none;
    background: transparent; font-size: 16px; }
  .field input::placeholder { color: #b6bcc6; }
  .send-btn { flex: none; width: 118px; height: 52px; border-radius: 12px;
    border: 1.5px solid var(--brand); color: var(--brand); background: var(--surface);
    font-size: 14px; font-weight: 600; }
  .send-btn:active { background: var(--brand-soft); }
  .send-btn:disabled { border-color: var(--line); color: var(--muted); background: var(--bg); }
  .submit-btn { width: 100%; height: 52px; border-radius: 14px; background: var(--brand);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1px; margin-top: 4px;
    box-shadow: 0 8px 20px rgba(229,72,77,.28); }
  .submit-btn:disabled { opacity: .6; box-shadow: none; }
  .fp-tip { font-size: 13px; color: var(--ink-2); margin: 2px 0 14px; line-height: 1.6; }
  .fp-step { font-size: 12px; color: var(--muted); margin: -4px 0 12px 2px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body data-page="forgot">
<div id="app">
  <header class="m-header">
    <a class="back" href="#" aria-label="返回"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 id="pageTitle">找回密码</h1>
    <div class="side"></div>
  </header>

  <main class="m-main" style="padding-top:6px">
    <div class="card pad" style="background:var(--surface)">
      <p class="fp-tip">输入注册邮箱获取验证码，验证后即可设置新密码。验证码 10 分钟内有效。</p>
      <form id="forgotForm" class="auth-form">
        <div class="field">
          <input id="fpEmail" type="email" autocomplete="email" placeholder="注册邮箱" />
        </div>
        <div style="display:flex;gap:10px;margin-bottom:12px">
          <div class="field" style="flex:1;margin-bottom:0">
            <input id="fpCode" type="text" autocomplete="off" placeholder="邮箱验证码" />
          </div>
          <button class="send-btn" type="button" id="fpSendBtn">获取验证码</button>
        </div>
        <div class="field">
          <input id="fpPassword" type="password" autocomplete="new-password" placeholder="新密码（至少 6 位）" />
        </div>
        <div class="field">
          <input id="fpConfirm" type="password" autocomplete="new-password" placeholder="确认新密码" />
        </div>
        <button class="submit-btn" type="submit" id="fpSubmit">重置密码</button>
      </form>
      <div class="fp-step" style="margin-top:14px;justify-content:center">重置成功后将自动跳转登录</div>
    </div>
  </main>

    <nav class="m-tabbar">
    <a data-tab="home" href="/m/index.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 3.5l8 7V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>首页</a>
    <a data-tab="contests" href="/m/contests.html"><svg viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.5a3.5 3.5 0 0 0 3.5 3.5M16 6h3.5v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3M8.5 21h7M10 17h4"/></svg>赛事</a>
    <a data-tab="rank" href="/m/rank.html"><svg viewBox="0 0 24 24"><path d="M5 20h14M7 20v-6h3v6M11 20V8h3v12M15 20V5h3v15"/></svg>榜单</a>
    <a data-tab="mine" href="/m/center.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3.1-5.5 7-5.5s7 2 7 5.5"/></svg>我的</a>
  </nav>
</div>
<script src="/assets/js/api.js?v=20261105a2"></script>
<script src="/m/m.js?v=20261105b1"></script>
</body>
</html>
