<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<title>登录 · BTR赛事平台</title>
  <meta name="description" content="BTR 赛事平台登录注册手机版。" />
  <meta name="keywords" content="登录,注册,手机登录,BTR赛事平台" />
<link rel="stylesheet" href="/m/m.css?v=20261105m4">
<style>
  /* ===== 登录/注册页专用样式 ===== */
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 4px 14px;
  }
  .auth-brand img {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    background: var(--surface);
  }
  .auth-brand b { display: block; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .auth-brand span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* tab 胶囊 */
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: #eceef2;
    border-radius: 999px;
    padding: 4px;
    margin-top: 2px;
  }
  .auth-tabs button {
    height: 42px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-2);
    background: transparent;
    transition: all .18s ease;
  }
  .auth-tabs button.is-active {
    background: var(--surface);
    color: var(--brand);
    box-shadow: 0 2px 8px rgba(20,22,26,.08);
  }

  /* 表单卡片 */
  .auth-form {
    margin-top: 14px;
    padding: 4px 0;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    height: 52px;
    margin-bottom: 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(229,72,77,.12);
  }
  .field .ico { flex: none; color: var(--muted); display: inline-flex; }
  .field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: none;
    background: transparent;
    font-size: 16px;
  }
  .field input::placeholder { color: #b6bcc6; }
  .field .eye { flex: none; color: var(--muted); padding: 6px; cursor: pointer; }

  /* 验证码行 */
  .captcha-row2 {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .captcha-row2 .field { flex: 1; margin-bottom: 0; }
  .captcha-row2 img {
    flex: none;
    width: 116px;
    height: 52px;
    border-radius: 12px;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: var(--surface);
  }

  /* 发送验证码按钮 */
  .send-btn {
    flex: none;
    width: 118px;
    height: 52px;
    border-radius: 12px;
    border: 1.5px solid var(--brand);
    color: var(--brand);
    background: var(--surface);
    font-size: 14px;
    font-weight: 600;
    transition: all .15s ease;
  }
  .send-btn:active { background: var(--brand-soft); }
  .send-btn:disabled { border-color: var(--line); color: var(--muted); background: var(--bg); }

  /* 提交按钮 */
  .submit-btn {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 4px;
    box-shadow: 0 8px 20px rgba(229,72,77,.28);
    transition: transform .1s ease, opacity .15s ease;
  }
  .submit-btn:active { transform: scale(.985); }
  .submit-btn:disabled { opacity: .6; box-shadow: none; }

  .auth-tip {
    text-align: center;
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 16px;
  }
  .auth-tip a { color: var(--brand); font-weight: 600; }
  .auth-agree {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    line-height: 1.5;
  }
  .auth-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    margin: -4px 0 12px 2px;
  }
  .auth-hint svg { flex: none; }
  .reg-group-title {
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
    margin: 2px 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .reg-group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
</style>
</head>
<body data-page="login">
<div id="app">
  <header class="m-header">
    <a class="back" href="#" aria-label="返回"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 id="pageTitle">账号</h1>
    <div class="side"></div>
  </header>

  <main class="m-main">
    <div class="auth-brand">
      <img src="/assets/img/btr-logo.svg" alt="BTR赛事平台" />
      <div>
        <b>BTR赛事平台</b>
        <span>赛事报名 · 作品提交 · 榜单公示</span>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" data-mode="login" class="is-active">登录</button>
      <button type="button" data-mode="reg">注册</button>
    </div>

    <form class="auth-form" id="loginForm">
      <div class="field">
        <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 20c0-3.8 3.6-6 8-6s8 2.2 8 6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <input id="loginAccount" type="text" autocomplete="username" placeholder="用户名或邮箱" />
      </div>
      <div class="field">
        <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="密码" />
        <span class="eye" data-eye="loginPassword"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      </div>
      <div class="captcha-row2" id="captchaRow" style="display:none">
        <div class="field">
          <input id="loginCaptcha" type="text" autocomplete="off" placeholder="验证码" />
        </div>
        <img id="captchaImg" src="" alt="验证码，点击刷新" />
      </div>
      <button class="submit-btn" type="submit" id="loginBtn">登 录</button>
      <div class="auth-tip">忘记密码？<a href="/m/forgot-password.html">去重置</a></div>
    </form>

    <form class="auth-form" id="regForm" style="display:none">
      <div class="reg-group-title">账号信息</div>
      <div class="field">
        <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <input id="regEmail" type="email" autocomplete="email" placeholder="邮箱（用于接收通知）" />
      </div>
      <div class="captcha-row2">
        <div class="field">
          <input id="regCode" type="text" autocomplete="off" placeholder="邮箱验证码" />
        </div>
        <button class="send-btn" type="button" id="sendCodeBtn">发送验证码</button>
      </div>
      <div class="auth-hint"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.5" r=".4" fill="currentColor"/></svg>验证码发送到你邮箱，10 分钟内有效</div>

      <div class="reg-group-title">个人信息</div>
      <div class="field">
        <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 20c0-4 3.5-6 7-6s7 2 7 6" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <input id="regNickname" type="text" autocomplete="nickname" placeholder="昵称（显示在作品与榜单）" />
      </div>
      <div class="field">
        <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <input id="regPassword" type="password" autocomplete="new-password" placeholder="设置密码（至少 6 位）" />
        <span class="eye" data-eye="regPassword"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      </div>
      <button class="submit-btn" type="submit" id="regBtn">注册并登录</button>
      <div class="auth-agree">注册即代表同意平台的赛事规则与作品授权说明</div>
    </form>
  </main>

    <nav class="m-tabbar">
    <a data-tab="home" href="/m/index.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 3.5l8 7V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>首页</a>
    <a data-tab="contests" href="/m/contests.html"><svg viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.5a3.5 3.5 0 0 0 3.5 3.5M16 6h3.5v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3M8.5 21h7M10 17h4"/></svg>赛事</a>
    <a data-tab="rank" href="/m/rank.html"><svg viewBox="0 0 24 24"><path d="M5 20h14M7 20v-6h3v6M11 20V8h3v12M15 20V5h3v15"/></svg>榜单</a>
    <a data-tab="mine" href="/m/center.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3.1-5.5 7-5.5s7 2 7 5.5"/></svg>我的</a>
  </nav>
</div>
<script src="/assets/js/api.js?v=20261105a3"></script>
<script src="/m/m.js?v=20261105b12"></script>
<script src="/assets/js/m-login.js?v=20261105d"></script>
</body>
</html>
