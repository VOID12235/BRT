<!DOCTYPE html>

<title>作品集 · BTR赛事平台</title>
<meta name="description" content="BTR 赛事平台选手公开作品集。" />

<style>
  .pf-head { display: flex; align-items: center; gap: 14px; padding: 18px 16px 16px; }
  .pf-avatar { width: 62px; height: 62px; border-radius: 50%; background: var(--brand-soft);
    color: var(--brand); font-size: 26px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; flex: none; }
  .pf-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .pf-name { font-size: 19px; font-weight: 700; }
  .pf-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .pf-stats { display: flex; padding: 12px 0; border-top: 1px solid var(--line); }
  .pf-stats .st { flex: 1; text-align: center; }
  .pf-stats b { display: block; font-size: 18px; }
  .pf-stats span { font-size: 12px; color: var(--muted); }
  .pf-section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;
    padding: 14px 16px 10px; }
  .pf-section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .pf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 0 14px; }
  .pf-work { background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow); }
  .pf-work .thumb { width: 100%; height: 96px; object-fit: cover; background: #eef0f3; }
  .pf-work .meta { padding: 8px 10px 10px; }
  .pf-work b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-work .sc { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
  .pf-award { display: flex; align-items: center; gap: 12px; background: var(--surface);
    border-radius: var(--radius-sm); box-shadow: var(--shadow); margin: 0 14px 8px; padding: 12px 14px; }
  .pf-award .rank-no { width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--amber-soft); color: var(--amber); font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; }
  .pf-award .info { flex: 1; min-width: 0; }
  .pf-award b { display: block; font-size: 14px; }
  .pf-award span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pf-award .prize { font-size: 14px; font-weight: 700; color: var(--brand); flex: none; }
</style>
</head>

          <div class="pf-name" id="pfName">加载中…</div>

        </div>
      </div>
      <div class="pf-stats">

        <div class="st"><b id="stWork">–</b><span>参赛作品</span></div>

      </div>

    <div class="pf-grid" id="pfWorks"></div>

    <div class="pf-section-title">获奖记录</div>
    <div id="pfAwards"></div>
  </main>
