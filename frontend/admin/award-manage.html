<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奖项管理 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/pages.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261105c" />
</head>
<body class="admin-body" data-page="awards" data-title="奖项管理" data-crumb="赛事 / 奖项">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-page-head">
          <div>
            <h2>奖项管理</h2>
            <p>按赛事配置奖项名称、名额与奖励（奖金 / 奖品 / 奖金加奖品）。公示时按排序自动固化获奖名单。</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="newAwardBtn">+ 新增奖项</button>
          </div>
        </div>

        <div class="admin-filters">
          <select class="select" id="awardContestFilter" style="min-width: 280px"></select>
          <span class="tiny muted" id="awardCount" style="margin-left:auto"></span>
        </div>

        <div class="grid-2">
          <div class="admin-table-card">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>排序</th><th>奖项名称</th><th>名额</th><th>奖励</th><th>操作</th></tr>
                </thead>
                <tbody id="awardTable">
                  <tr><td colspan="5"><div class="skeleton" style="height: 60px"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card side-card">
            <h3>奖项说明</h3>
            <div class="prose" style="font-size: 12.5px">
              <p>榜单按评委平均分从高到低排序，依次落入各奖项名额，名额发完即止。</p>
              <p>奖励支持三种形式：仅奖金（填奖金）、仅奖品（填奖品描述）、奖金加奖品（两者都填）。</p>
              <p>排序值越小越靠前，例如一等奖 1、二等奖 2、三等奖 3。</p>
            </div>
            <div class="alert alert-info" style="margin-top: 16px">
              赛事进入「已公示」状态时，系统会固化获奖名单并发送获奖通知邮件。
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js?v=20261105a3"></script>
  <script src="/assets/js/admin.js?v=20261105d"></script>
</body>
</html>
