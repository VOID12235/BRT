<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮件记录 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/pages.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261105c" />
</head>
<body class="admin-body" data-page="mails" data-title="邮件记录" data-crumb="系统 / 邮件记录">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-page-head">
          <div>
            <h2>邮件记录</h2>
            <p>查看系统发出的每一封邮件状态。未配置 SMTP 时记录为 SKIPPED，不影响业务。</p>
          </div>
        </div>

        <div class="admin-filters">
          <select class="select" id="mailStatusFilter" style="width: 140px">
            <option value="">全部状态</option>
            <option value="PENDING">待发送</option>
            <option value="SENT">已发送</option>
            <option value="SKIPPED">已跳过</option>
            <option value="FAILED">失败</option>
          </select>
          <div class="admin-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" id="mailRecipient" type="search" placeholder="搜索收件邮箱" />
          </div>
          <button class="btn btn-outline" id="mailSearchBtn">查询</button>
          <span class="tiny muted" id="mailCount" style="margin-left:auto"></span>
        </div>

        <div class="admin-table-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>时间</th><th>收件人</th><th>模板</th><th>主题</th><th>状态</th><th>错误信息</th></tr>
              </thead>
              <tbody id="mailTable">
                <tr><td colspan="6"><div class="skeleton" style="height: 60px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-table-foot">
            <span id="mailFoot">—</span>
            <div class="pagination" id="mailPagination"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js?v=20261105a3"></script>
  <script src="/assets/js/admin.js?v=20261105c"></script>
</body>
</html>
