<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仪表盘 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body class="admin-body" data-page="dashboard" data-title="仪表盘" data-crumb="总览">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-hero">
          <div>
            <span class="badge badge-plain">BTR Admin</span>
            <h2 style="margin-top: 10px">下午好，<span id="adminGreeting">管理员</span></h2>
            <p>这里是平台运行概览。今天也请让每一场比赛，被认真对待。</p>
          </div>
          <div class="admin-hero-actions">
            <a class="btn btn-outline btn-sm" href="/admin/contest-manage.html" style="border-color: rgba(255,255,255,.24); color:#fff">新建赛事</a>
            <a class="btn btn-primary btn-sm" href="/admin/export.html">导出名单</a>
          </div>
        </div>

        <div class="grid-4" id="dashStats">
          <div class="stat-card"><div class="label"><span class="dot"></span>用户总数</div><div class="value">—</div></div>
          <div class="stat-card"><div class="label"><span class="dot"></span>赛事总数</div><div class="value">—</div></div>
          <div class="stat-card"><div class="label"><span class="dot"></span>报名人次</div><div class="value">—</div></div>
          <div class="stat-card"><div class="label"><span class="dot"></span>提交作品</div><div class="value">—</div></div>
        </div>

        <div class="dash-grid" style="margin-top: 20px">
          <div>
            <div class="card trend-card">
              <div class="trend-head">
                <div><h3>近 7 日报名趋势</h3><p class="tiny muted" style="margin-top:3px">按报名创建时间统计</p></div>
                <span class="badge badge-soft badge-plain" id="trendTotal">—</span>
              </div>
              <div class="trend-bars" id="trendBars"></div>
            </div>

            <div class="card dash-table" style="margin-top: 20px">
              <div class="card-head">
                <div><h3>最近报名</h3><p>最新提交的报名记录</p></div>
                <a class="btn btn-ghost btn-xs" href="/admin/signup-manage.html">全部报名 →</a>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>选手</th><th>赛事</th><th>学校</th><th>时间</th><th>状态</th></tr></thead>
                  <tbody id="recentSignups">
                    <tr><td colspan="5"><div class="skeleton" style="height: 52px"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="dash-side">
            <div class="card side-card">
              <h3>待处理</h3>
              <div class="meta-list" id="dashPending">
                <div><span>加载中</span><b>—</b></div>
              </div>
            </div>

            <div class="card side-card">
              <h3>快捷入口</h3>
              <div class="quick-grid">
                <a class="quick-link" href="/admin/contest-manage.html"><b>赛事管理</b><span>创建与状态流转</span></a>
                <a class="quick-link" href="/admin/signup-manage.html"><b>报名管理</b><span>审核与导出</span></a>
                <a class="quick-link" href="/admin/judge-manage.html"><b>评委分配</b><span>作品派发与进度</span></a>
                <a class="quick-link" href="/admin/notice-manage.html"><b>公告管理</b><span>发布平台通知</span></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
