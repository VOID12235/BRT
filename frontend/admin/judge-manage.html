<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评委分配 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body class="admin-body" data-page="judges" data-title="评委分配" data-crumb="评审 / 分配">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-page-head">
          <div>
            <h2>评委分配</h2>
            <p>把赛事作品派发给评委。评委只能看到分配给自己的作品。</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="assignBtn">+ 分配作品</button>
          </div>
        </div>

        <div class="grid-4" id="judgeCards" style="margin-bottom: 20px"></div>

        <div class="admin-filters">
          <select class="select" id="assignContestFilter">
            <option value="">全部赛事</option>
          </select>
          <span class="tiny muted" id="assignCount" style="margin-left:auto"></span>
        </div>

        <div class="admin-table-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>评委</th><th>赛事</th><th>作品</th><th>分配时间</th><th>操作</th></tr>
              </thead>
              <tbody id="assignTable">
                <tr><td colspan="5"><div class="skeleton" style="height: 60px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-table-foot">
            <span id="assignFoot">—</span>
            <span class="tiny muted">同一评委与作品不会重复分配</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
