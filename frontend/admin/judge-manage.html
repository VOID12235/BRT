<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评委分配 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105d" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=20261105e" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20261105d" />
  <link rel="stylesheet" href="/assets/css/pages.css?v=20261105d" />
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261105e" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261105d" />
</head>
<body class="admin-body" data-page="judges" data-title="评委分配" data-crumb="评委 / 分配">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-page-head">
          <div>
            <h2>评委分配</h2>
            <p>支持多评委独立评审（一个项目可配多个评委）；整体分配后评审期新提交作品自动进入评委任务池。</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="assignBtn">+ 分配项目</button>
          </div>
        </div>

        <div class="grid-4" id="judgeCards" style="margin-bottom: 20px"></div>

        <div class="admin-filters">
          <select class="select" id="assignContestFilter">
            <option value="">全部赛事</option>
          </select>
          <span class="tiny muted" id="assignCount" style="margin-left:auto"></span>
        </div>

        <div class="admin-table-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>评委</th><th>赛事项目</th><th>作品</th><th>已评</th><th>分配时间</th><th>操作</th></tr>
              </thead>
              <tbody id="assignTable">
                <tr><td colspan="6"><div class="skeleton" style="height: 60px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-table-foot">
            <span id="assignFoot">…</span>
            <span class="tiny muted">整体分配（动态跟随）按赛事授权，新提交作品自动进池；也可按作品精确分配</span>
          </div>
        </div>

        <div class="admin-page-head" style="margin-top: 30px">
          <div>
            <h2>成绩与排名</h2>
            <p>系统按评委打分聚合自动生成成绩与排名；管理员可改最终分（留痕），分差≥15自动标记待复核，固化后榜单/获奖联动锁定。</p>
          </div>
          <div class="actions">
            <button class="btn btn-warning" id="finalizeBtn">固化成绩</button>
          </div>
        </div>
        <div class="admin-filters">
          <select class="select" id="scoreContestFilter">
            <option value="">请选择赛事</option>
          </select>
          <span class="tiny muted" id="scoreLockedTip" style="margin-left:auto"></span>
        </div>
        <div class="admin-table-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>排名</th><th>作品/选手</th><th>学校</th><th>评委打分</th><th>聚合分</th><th>状态</th><th>操作</th></tr>
              </thead>
              <tbody id="scoreTable">
                <tr><td colspan="7" class="muted center" style="padding: 24px">选择赛事后查看成绩与排名</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-table-foot">
            <span class="tiny muted">聚合模式由赛事配置（均分 / 去极值）；改最终分后排名自动重算，固化前可反复调整</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js?v=20261105a4"></script>
  <script src="/assets/js/admin.js?v=20261105h"></script>
</body>
</html>
