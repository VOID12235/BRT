<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报名管理 · BTR 管理后台</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/pages.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261105c" />
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20261105c" />
</head>
<body class="admin-body" data-page="signups" data-title="报名管理" data-crumb="赛事 / 报名">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="admin-page-head">
          <div>
            <h2>报名管理</h2>
            <p>查看选手报名信息、审核状态，并导出报名名单。</p>
          </div>
          <div class="actions">
            <button class="btn btn-outline" id="exportSignupsBtn">导出报名名单</button>
          </div>
        </div>

        <div class="admin-filters">
          <select class="select" id="signupContestFilter">
            <option value="">全部赛事</option>
          </select>
          <select class="select" id="signupStatusFilter">
            <option value="">全部状态</option>
            <option value="APPROVED">已报名</option>
            <option value="PENDING">待审核</option>
            <option value="CANCELED">已取消</option>
          </select>
          <span class="tiny muted" id="signupCount" style="margin-left:auto"></span>
        </div>

        <div class="admin-table-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>选手</th><th>账号</th><th>赛事</th><th>学校 / 单位</th><th>联系方式</th><th>作品</th><th>报名时间</th><th>状态</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="signupTable">
                <tr><td colspan="9"><div class="skeleton" style="height: 60px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-table-foot">
            <span id="signupFoot">—</span>
            <div class="pagination" id="signupPagination"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-backdrop" id="adminBackdrop"></div>

  <script src="/assets/js/api.js?v=20261105a3"></script>
  <script src="/assets/js/admin.js?v=20261105e"></script>
</body>
</html>
