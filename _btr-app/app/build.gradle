plugins {
    id 'com.android.application'
}

android {
    namespace 'com.btr.platform'
    compileSdk 34

    defaultConfig {
        applicationId "com.btr.platform"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('/opt/btr-app/keystore/btr-release.jks')
            storePassword 'btr2026'
            keyAlias 'btr'
            keyPassword 'btr2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
