upstream btr_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 60m;
    client_body_timeout 30s;

    # 基础安全响应头（server 级定义，未定义 add_header 的 location 会自动继承）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（版本号通过 ?v= 控制，可长缓存）
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # 公共头部/页脚需要实时生效，禁止缓存（expires -1 = no-cache）
    location = /common/header.html {
        expires -1;
        try_files $uri =404;
    }

    location = /common/footer.html {
        expires -1;
        try_files $uri =404;
    }

    # 后端 API 与文件预览
    location /api/ {
        proxy_pass http://btr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 上传文件兜底（旧数据若使用 /uploads/ 前缀）
    location /uploads/ {
        proxy_pass http://btr_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
